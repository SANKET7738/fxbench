[project]
name = "fxbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "numpy>=1.26",
    "openai>=2.0",
    "pycel>=1.0b30",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "datasets>=3.0",
    "tqdm>=4.66",
    "rich>=15.0.0",
    "tabulate>=0.9",
    "tiktoken>=0.12",
    "xlwings>=0.35.2",
    "pywin32>=311 ; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxbench"]
